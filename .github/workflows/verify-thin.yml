name: verify-thin

# Verificación manual: la pantalla Go arranca en cada OS (sin publicar nada).
# - Compila el thin para el runner, prueba arranque sin env (exit 2 esperado).
# - Prueba el wrapper Node (--version y fallback --go sin TTY).
# - En ubuntu: ejecuta install.sh de punta a punta.
# La salida de cada job es la evidencia (docs/evidence/ci-thin.md).

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Info runner
        run: uname -a && go version || true

      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.23.2"
          cache: true
          cache-dependency-path: go.sum

      - run: go mod download

      - name: Build thin para este runner
        run: |
          go build -trimpath -ldflags "-s -w" -o /tmp/noira-thin-test ./cmd/noira-thin
          ls -la /tmp/noira-thin-test

      - name: Boot sin entorno (esperado: exit 2 + mensaje)
        run: |
          set +e
          /tmp/noira-thin-test 2>boot-err.log
          code=$?
          set -e
          echo "exit=$code"
          cat boot-err.log
          test "$code" = "2"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wrapper Node (sin TTY aquí)
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node bin/noiracoder.mjs --version
          node bin/noiracoder.mjs --go --version

      - name: install.sh de punta a punta (solo ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo bash install.sh || bash install.sh
          noira --version || "$HOME/.npm-global/bin/noira" --version || true
