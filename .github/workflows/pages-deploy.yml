name: NoiraCoder Pages Deploy

# Despliegue directo a Cloudflare Pages (el proyecto está en modo
# direct-upload, sin integración GitHub). Se dispara con pushes a
# landing/ y manualmente. El cron del blog despliega desde su propio
# workflow porque sus commits llevan [skip ci].
on:
  push:
    branches:
      - main
    paths:
      - 'landing/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy landing/ to Pages
        run: npx -y wrangler@4 pages deploy landing --project-name=noiracoder --branch=main --commit-hash=${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
