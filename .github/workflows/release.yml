name: release

# HITO 6: binarios noira-thin (cliente fino, sin motor heredado) para
# Windows x64, Linux x64/arm64 y macOS Intel/Apple Silicon, con sha256 y NOTICE.
# - workflow_dispatch: compila y sube ARTIFACTS (verificación, no publica).
# - tag noira-go-v*: crea/actualiza el Release y adjunta binarios + sumas.
# El release.yml heredado (goreleaser+brew+aur) queda sustituido: esas
# integraciones eran del upstream y sus secretos no existen aquí.

on:
  workflow_dispatch:
  push:
    tags:
      - "noira-go-v*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.23.2"
          cache: true
          cache-dependency-path: go.sum

      - run: go mod download

      - name: Build noira-thin (5 targets)
        run: |
          mkdir -p dist-go
          export CGO_ENABLED=0
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist-go/noira-thin-Windows-x86_64.exe ./cmd/noira-thin
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist-go/noira-thin-Linux-x86_64 ./cmd/noira-thin
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist-go/noira-thin-Linux-arm64 ./cmd/noira-thin
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist-go/noira-thin-Darwin-x86_64 ./cmd/noira-thin
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist-go/noira-thin-Darwin-arm64 ./cmd/noira-thin
          cp NOTICE dist-go/NOTICE.txt
          ls -la dist-go/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noira-thin-all
          path: dist-go/
          if-no-files-found: error

  sums:
    needs: build
    if: startsWith(github.ref, 'refs/tags/noira-go-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: noira-thin-all
          path: dist-go
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist-go && sha256sum noira-thin-* NOTICE.txt > SHA256SUMS)
          cat dist-go/SHA256SUMS
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "Pantalla Go (cliente fino) + sumas sha256 + NOTICE." --prerelease
          gh release upload "${{ github.ref_name }}" dist-go/noira-thin-* dist-go/SHA256SUMS dist-go/NOTICE.txt --clobber
