name: NoiraCoder Blog Diario

# Patrón transversal del ecosistema (misma forma que signals-cron/watchdog):
# cron programado + ejecución manual + secretos aislados POR PROYECTO.
# BLOG_API_KEY es el secreto de ESTE repo (no se comparte entre proyectos).
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate daily post
        run: node tools/generate-post.mjs
        working-directory: landing
        env:
          BLOG_API_KEY: ${{ secrets.BLOG_API_KEY }}
          BLOG_API_BASE: ${{ vars.BLOG_API_BASE || 'https://openrouter.ai/api/v1/chat/completions' }}
          BLOG_API_MODEL: ${{ vars.BLOG_API_MODEL || 'openai/gpt-oss-20b' }}

      - name: Heartbeat - commit post
        run: |
          git config user.name "noiracoder-bot"
          git config user.email "bot@noiracoder.pages.dev"
          git add -f landing/blog/ landing/sitemap.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: post diario del blog [skip ci]"
          git push origin main || echo "No changes to push"

      - name: Deploy landing/ to Pages
        run: npx -y wrangler@4 pages deploy landing --project-name=noiracoder --branch=main --commit-hash=${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
